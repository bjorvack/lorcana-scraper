name: cards

on:
  # Monthly safety net + manual trigger for new-set release days.
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish a new cards-vN release even if content is unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prior cards-vN release (if any)
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prior
          prior_tag=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -E '^cards-v' | head -n 1 || true)
          if [ -n "$prior_tag" ]; then
            echo "Found prior tag: $prior_tag"
            gh release download "$prior_tag" -p cards.json -D prior
            echo "tag=$prior_tag" >> "$GITHUB_OUTPUT"
            echo "have_prior=1" >> "$GITHUB_OUTPUT"
          else
            echo "No prior cards-vN release; treating prior as empty."
            echo "have_prior=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cards pipeline
        id: scrape
        run: |
          if [ "${{ steps.prior.outputs.have_prior }}" = "1" ]; then
            pnpm scrape:cards --out ./out --prior ./prior/cards.json --prior-tag "${{ steps.prior.outputs.tag }}"
          else
            pnpm scrape:cards --out ./out
          fi
          new_hash=$(cat ./out/cards.json.sha256)
          echo "new_hash=$new_hash" >> "$GITHUB_OUTPUT"
          if [ -f ./prior/cards.json ]; then
            prior_hash=$(jq -r .cardSetVersion ./prior/cards.json | sed 's/^sha256://')
            if [ "$new_hash" = "$prior_hash" ]; then
              echo "changed=0" >> "$GITHUB_OUTPUT"
            else
              echo "changed=1" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          path: out/

      - name: Skip release (unchanged)
        if: steps.scrape.outputs.changed == '0' && inputs.force_publish != true
        run: echo "No content changes since ${{ steps.prior.outputs.tag }}; exiting without a release."

      - name: Compute release tag
        if: steps.scrape.outputs.changed == '1' || inputs.force_publish == true
        id: tagname
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y.%m.%d)
          seq=1
          while gh release view "cards-v${today}-$(printf '%02d' $seq)" >/dev/null 2>&1; do
            seq=$((seq + 1))
          done
          tag="cards-v${today}-$(printf '%02d' $seq)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Build short release notes
        if: steps.scrape.outputs.changed == '1' || inputs.force_publish == true
        id: notes
        run: |
          # The full diff lives in cards-diff.md (attached). The release body
          # is capped at 125 KB by GitHub, so we extract just the header.
          head -n 5 ./out/cards-diff.md > ./out/release-notes.md
          card_count=$(jq '.cards | length' ./out/cards.json)
          version=$(jq -r .cardSetVersion ./out/cards.json)
          {
            echo ""
            echo "Total cards: **${card_count}**"
            echo ""
            echo "\`cardSetVersion\`: \`${version}\`"
            echo ""
            echo "See \`cards-diff.md\` (attached) for the full per-card diff."
          } >> ./out/release-notes.md

      - name: Publish cards-vN release
        if: steps.scrape.outputs.changed == '1' || inputs.force_publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tagname.outputs.tag }}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file ./out/release-notes.md \
            ./out/cards.json \
            ./out/cards.json.sha256 \
            ./out/cards-diff.md

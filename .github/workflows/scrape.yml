name: scrape

# Scheduled tournaments-vN refresh, sharded.
#
# The listing endpoint has ~57 pages of tournaments. To split the
# Cloudflare 1015 rate-limit budget across multiple egress IPs, we run
# N parallel shards (each on its own GitHub Actions runner) that scrape
# disjoint page ranges. A final `merge` job combines the shard outputs
# into a single dataset, validates, and publishes the release.
#
# Resume / dedup is handled by each shard passing the latest
# tournaments-vN as `--prior` so already-known tournaments are skipped.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if no new tournaments"
        type: boolean
        default: false
      max_tournaments:
        description: "Cap tournaments per shard (debug)"
        type: string
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cards_tag: ${{ steps.cards.outputs.tag }}
      prior_tag: ${{ steps.prior.outputs.tag }}
      have_prior: ${{ steps.prior.outputs.have_prior }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned cards-vN
        id: cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^cards-v' | head -n 1)
          [ -n "$tag" ] || { echo "No cards-vN release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p cards
          gh release download "$tag" --repo bjorvack/lorcana-scraper -p cards.json -D cards
      - name: Download latest tournaments-vN (prior)
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prior
          tag=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^tournaments-v' | head -n 1 || true)
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo bjorvack/lorcana-scraper -p dataset.json -D prior
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "have_prior=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_prior=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload cards + prior
        uses: actions/upload-artifact@v4
        with:
          name: scrape-inputs
          path: |
            cards/cards.json
            prior/dataset.json
          if-no-files-found: ignore
          retention-days: 1

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # Total shards and the listing page range each shard owns. Keep
      # PAGES_PER_SHARD * TOTAL_SHARDS >= real page count (~60) or the
      # tail shard will miss pages.
      TOTAL_SHARDS: 4
      PAGES_PER_SHARD: 16
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install chromium for inkdecks adapter
        run: |
          pnpm exec playwright install chromium --with-deps || \
            npx -y playwright@1.60 install chromium --with-deps

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Restore http cache
        uses: actions/cache@v4
        with:
          path: out/http-cache
          # Per-shard cache key so shards don't clobber each other.
          key: http-cache-shard-${{ matrix.shard }}-${{ needs.prepare.outputs.prior_tag }}
          restore-keys: |
            http-cache-shard-${{ matrix.shard }}-

      - name: Restore inkdecks browser state (cf_clearance cookie)
        uses: actions/cache@v4
        with:
          path: .cache/inkdecks-state.json
          # The Cloudflare clearance cookie has roughly a 30-minute
          # TTL but we keep the storage state per shard anyway — even
          # an expired cookie speeds up the next challenge.
          key: inkdecks-state-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            inkdecks-state-shard-${{ matrix.shard }}-

      - name: Compute page range
        id: range
        run: |
          from=$(( ${{ matrix.shard }} * PAGES_PER_SHARD + 1 ))
          to=$(( from + PAGES_PER_SHARD - 1 ))
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to"     >> "$GITHUB_OUTPUT"
          echo "shard ${{ matrix.shard }}: pages $from..$to"

      - name: Run pipeline (shard ${{ matrix.shard }})
        run: |
          args=()
          [ -n "${{ inputs.max_tournaments }}" ] && args+=("--max-tournaments" "${{ inputs.max_tournaments }}")
          if [ "${{ needs.prepare.outputs.have_prior }}" = "1" ]; then
            args+=("--prior" "./prior/dataset.json")
          fi
          pnpm scrape:tournaments \
            --cards ./cards/cards.json \
            --cards-release-tag "${{ needs.prepare.outputs.cards_tag }}" \
            --page-from ${{ steps.range.outputs.from }} \
            --page-to   ${{ steps.range.outputs.to }} \
            --max-decks-per-tournament 16 \
            --persist-every 5 \
            --out ./out "${args[@]}"

      # `if: always()` — the pipeline persists dataset.json every 5
      # tournaments, so even a shard that dies from a Cloudflare 1015
      # rate-limit exhaustion still has useful partial data on disk.
      # Always ship it; the merge job will stitch together whatever
      # made it through.
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  merge:
    # Run even if some shards failed — we still want to publish whatever
    # partial data made it through. `prepare` is non-negotiable though
    # (without cards.json + prior we have nothing to merge against).
    needs: [prepare, scrape]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards/

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Merge shards
        run: |
          # nullglob: if no shard produced a dataset.json, the array is empty
          # instead of containing the literal glob pattern.
          shopt -s nullglob
          shards=(shards/*/dataset.json)
          echo "merging ${#shards[@]} shard(s): ${shards[*]:-<none>}"
          if [ ${#shards[@]} -eq 0 ]; then
            echo "::error::No shard produced a dataset.json — nothing to merge."
            exit 1
          fi
          pnpm tournaments:merge-shards \
            --out ./out \
            --dataset-version 1.0.0 \
            "${shards[@]}"

      - name: Validate merged dataset
        run: |
          pnpm tournaments:validate \
            --dataset ./out/dataset.json \
            --cards ./cards/cards.json \
            --report ./out/resolution-report.json

      - name: Detect changes vs prior
        id: changed
        run: |
          if [ -f ./prior/dataset.json ]; then
            prior_n=$(jq '.tournaments | length' ./prior/dataset.json)
          else
            prior_n=0
          fi
          new_n=$(jq '.tournaments | length' ./out/dataset.json)
          echo "prior=$prior_n" >> "$GITHUB_OUTPUT"
          echo "new=$new_n"     >> "$GITHUB_OUTPUT"
          if [ "$new_n" -gt "$prior_n" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next tournaments-v tag
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        id: tagname
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^tournaments-v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -z "$last" ]; then
            tag="tournaments-v1.0.0"
          else
            v=${last#tournaments-v}
            IFS='.' read -r major minor patch <<<"$v"
            tag="tournaments-v${major}.$((minor + 1)).0"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload merged artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tagname.outputs.tag || format('scrape-{0}', github.run_id) }}
          path: out/
          retention-days: 30

      - name: Publish release
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tagname.outputs.tag }}"
          n_tournaments=$(jq '.tournaments | length' ./out/dataset.json)
          n_decks=$(jq '[.tournaments[].decks | length] | add // 0' ./out/dataset.json)
          rate=$(jq -r '(.totalFailureRate * 100) | . * 100 | floor | . / 100 | tostring + "%"' ./out/resolution-report.json)
          card_set_v=$(jq -r .cardSetVersion ./out/dataset.json)
          {
            echo "## $tag"
            echo
            echo "Tournaments: **$n_tournaments**"
            echo "Decks: **$n_decks**"
            echo "Resolution failure rate: $rate"
            echo
            echo "Pinned cards snapshot: \`${{ needs.prepare.outputs.cards_tag }}\`"
            echo "\`cardSetVersion\`: \`$card_set_v\`"
            echo
            echo "See \`resolution-report.json\` (attached) for per-source stats."
          } > release-notes.md
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            ./out/dataset.json \
            ./out/dataset.json.sha256 \
            ./out/resolution-report.json

      - name: Dispatch upstream-tournaments-released to lorcana-training
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          tag="${{ steps.tagname.outputs.tag }}"
          curl -fSs -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bjorvack/lorcana-training/dispatches \
            -d "{\"event_type\":\"upstream-tournaments-released\",\"client_payload\":{\"tag\":\"$tag\"}}"

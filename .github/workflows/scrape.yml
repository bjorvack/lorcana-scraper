name: scrape

# Scheduled tournaments-vN refresh.
#
# Per-source split (A2):
#   prepare           — resolve pinned cards-vN + latest tournaments-vN
#   scrape-limitless  — 4-shard matrix, REST API
#   scrape-lorcana-gg — 4-shard matrix, HTTP-only via dotgg
#   scrape-topdeck    — 4-shard matrix, REST API (TOPDECK_API_KEY)
#   scrape-dreamborn  — single job, dreamborn.ink trending snapshot
#   merge             — stitch every shard artifact into one dataset
#
# Each source is run as a hash-modulo matrix (A1): every shard
# walks the full listing but only fetches standings/decks whose
# tournamentKey hashes to its bucket. Bumping the matrix size on
# any single source scales the work linearly without re-thinking
# pagination.
#
# All adapters are API-based — no HTML scraping, no headless
# browser, no Cloudflare Turnstile. A 1015 / 429 on one source
# can't kill the other; per-tournament artifact files (B1) mean
# a shard that fails partway still contributes everything it had
# already finished — the merge step picks up whatever is on disk.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if no new tournaments"
        type: boolean
        default: false
      max_tournaments:
        description: "Per-source cap (e.g. 50 or `limitlesstcg.com=40,lorcana.gg=200`)"
        type: string
        default: ""

permissions:
  contents: write
  packages: read

# Silence the "Node.js 20 actions are deprecated" warning emitted
# for the bundled JavaScript actions (actions/checkout, actions/cache,
# pnpm/action-setup, …). Forces those actions to run on the runner's
# Node 24 ahead of GitHub making it the default in June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cards_tag: ${{ steps.cards.outputs.tag }}
      prior_tag: ${{ steps.prior.outputs.tag }}
      have_prior: ${{ steps.prior.outputs.have_prior }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned cards-vN
        id: cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^cards-v' | head -n 1)
          [ -n "$tag" ] || { echo "No cards-vN release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p cards
          gh release download "$tag" --repo bjorvack/lorcana-scraper -p cards.json -D cards
      # C2 in-progress snapshot: a cache populated at the end of
      # every `merge` job, even when no release was cut. Restores
      # here so a run that crashed-or-no-changed still feeds its
      # progress forward to the next run. Falls through to the
      # released `tournaments-vN` if no snapshot is cached.
      - name: Restore in-progress merged snapshot (C2)
        id: snapshot
        uses: actions/cache/restore@v4
        with:
          path: snapshot/
          # Restore-only: the matching `cache/save` step in `merge`
          # writes the new snapshot with the run id appended, so this
          # always picks up the freshest previous run via the
          # restore-keys prefix.
          key: scrape-merged-snapshot-restore-only
          restore-keys: |
            scrape-merged-snapshot-
      - name: Download latest tournaments-vN (prior)
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prior
          # Prefer the in-progress snapshot if it's present *and*
          # parses — it's strictly newer than the latest release.
          if [ -f snapshot/dataset.json ]; then
            cp snapshot/dataset.json prior/dataset.json
            echo "Using C2 in-progress snapshot for prior"
            echo "tag=snapshot" >> "$GITHUB_OUTPUT"
            echo "have_prior=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^tournaments-v' | head -n 1 || true)
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo bjorvack/lorcana-scraper -p dataset.json -D prior
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "have_prior=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_prior=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload cards + prior
        uses: actions/upload-artifact@v4
        with:
          name: scrape-inputs
          path: |
            cards/cards.json
            prior/dataset.json
          if-no-files-found: ignore
          retention-days: 1

  scrape-lorcana-gg:
    needs: prepare
    runs-on: ubuntu-latest
    # lorcana.gg is pure HTTP. Each shard lists the full archive
    # then takes a hash-mod slice of new refs (A1), so they all
    # progress in parallel without overlapping API spend on the
    # standings/deck fetches.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Restore http cache
        uses: actions/cache@v4
        with:
          path: out/http-cache
          # Shared restore prefix: cache writes are unique per shard
          # so we don't collide, but every shard can read the
          # warmest preceding cache via the prefix fallback.
          key: http-cache-lorcana-gg-${{ needs.prepare.outputs.prior_tag }}-shard-${{ matrix.shard }}
          restore-keys: |
            http-cache-lorcana-gg-${{ needs.prepare.outputs.prior_tag }}-
            http-cache-lorcana-gg-

      - name: Run pipeline (lorcana.gg shard ${{ matrix.shard }})
        run: |
          args=()
          max_t="${{ inputs.max_tournaments }}"
          [ -n "$max_t" ] && args+=("--max-tournaments" "$max_t")
          if [ "${{ needs.prepare.outputs.have_prior }}" = "1" ]; then
            args+=("--prior" "./prior/dataset.json")
          fi
          pnpm scrape:tournaments \
            --cards ./cards/cards.json \
            --cards-release-tag "${{ needs.prepare.outputs.cards_tag }}" \
            --sources lorcana.gg \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ env.TOTAL_SHARDS }} \
            --max-decks-per-tournament 16 \
            --out ./out "${args[@]}"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-lorcana-gg-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  scrape-limitless:
    needs: prepare
    runs-on: ubuntu-latest
    # Limitless is a public REST API with a 50-req-per-5-min rate
    # limit. Sharding helps when ingesting hundreds of standings
    # endpoints — each shard owns ~1/N of the new refs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Restore http cache
        uses: actions/cache@v4
        with:
          path: out/http-cache
          # Standings are immutable; once cached, re-runs cost zero
          # API budget for already-ingested tournaments. Per-shard
          # write key + shared restore prefix lets every shard pick
          # up the freshest cache from any prior shard or run.
          key: http-cache-limitless-${{ needs.prepare.outputs.prior_tag }}-shard-${{ matrix.shard }}
          restore-keys: |
            http-cache-limitless-${{ needs.prepare.outputs.prior_tag }}-
            http-cache-limitless-

      - name: Run pipeline (limitlesstcg.com shard ${{ matrix.shard }})
        run: |
          args=()
          max_t="${{ inputs.max_tournaments }}"
          [ -n "$max_t" ] && args+=("--max-tournaments" "$max_t")
          if [ "${{ needs.prepare.outputs.have_prior }}" = "1" ]; then
            args+=("--prior" "./prior/dataset.json")
          fi
          pnpm scrape:tournaments \
            --cards ./cards/cards.json \
            --cards-release-tag "${{ needs.prepare.outputs.cards_tag }}" \
            --sources limitlesstcg.com \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ env.TOTAL_SHARDS }} \
            --max-decks-per-tournament 16 \
            --min-players 8 \
            --out ./out "${args[@]}"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-limitless-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  scrape-topdeck:
    needs: prepare
    runs-on: ubuntu-latest
    # TopDeck.gg's bulk endpoint has a low rate limit and the full
    # tournament list comes back in a single POST. Sharding here
    # parallelises standings-level work once Lorcana coverage grows;
    # for now every shard sees a small slice (often empty).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Run pipeline (topdeck.gg shard ${{ matrix.shard }})
        env:
          # The adapter is a no-op when this secret is missing, so a
          # fork without the secret won't fail the job — it just
          # contributes zero tournaments to the merged dataset.
          TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
        run: |
          args=()
          max_t="${{ inputs.max_tournaments }}"
          [ -n "$max_t" ] && args+=("--max-tournaments" "$max_t")
          if [ "${{ needs.prepare.outputs.have_prior }}" = "1" ]; then
            args+=("--prior" "./prior/dataset.json")
          fi
          pnpm scrape:tournaments \
            --cards ./cards/cards.json \
            --cards-release-tag "${{ needs.prepare.outputs.cards_tag }}" \
            --sources topdeck.gg \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ env.TOTAL_SHARDS }} \
            --max-decks-per-tournament 16 \
            --min-players 8 \
            --out ./out "${args[@]}"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-topdeck-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  scrape-dreamborn:
    needs: prepare
    runs-on: ubuntu-latest
    # dreamborn.ink's trending listing is capped at 24 results per
    # call (no pagination), so sharding adds no parallelism. Every
    # run is one job, one synthetic "tournament", up to 24 decks.
    # Deck-level dedup against the prior dataset means a deck that
    # stays trending across days is only ingested once.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      # Chromium for the Playwright escalation path in
      # src/sources/dreamborn.ts. dreamborn.ink is Cloudflare-fronted
      # and 403s the undici fetch from GitHub-runner IPs; the
      # Playwright APIRequestContext uses a real browser TLS profile
      # which Cloudflare actually accepts. Lazy-loaded inside the
      # adapter so this only matters when escalation fires.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run pipeline (dreamborn.ink)
        run: |
          args=()
          if [ "${{ needs.prepare.outputs.have_prior }}" = "1" ]; then
            args+=("--prior" "./prior/dataset.json")
          fi
          pnpm scrape:tournaments \
            --cards ./cards/cards.json \
            --cards-release-tag "${{ needs.prepare.outputs.cards_tag }}" \
            --sources dreamborn.ink \
            --out ./out "${args[@]}"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-dreamborn
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  merge:
    # Run even if some shards failed — we still want to publish whatever
    # partial data made it through. `prepare` is non-negotiable though.
    needs: [prepare, scrape-limitless, scrape-lorcana-gg, scrape-topdeck, scrape-dreamborn]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards/

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Build shard summary block
        id: shard_summary
        run: |
          # E3: every shard writes a summary.json (F2). Stitch
          # them into a markdown table so the release notes show
          # who did what. Bash heredoc keeps the GHA template
          # syntax happy; output stored as a multi-line GHA output.
          shopt -s nullglob
          summaries=(shards/shard-*/summary.json)
          {
            echo "### Shard runs"
            echo
            if [ ${#summaries[@]} -eq 0 ]; then
              echo "_no shard summaries found_"
            else
              echo "| Shard | Sources | Added | Total | Decks (added/kept) | Elapsed | Failure |"
              echo "|---|---|---:|---:|---|---:|---:|"
              for s in "${summaries[@]}"; do
                shard=$(basename "$(dirname "$s")")
                jq -r --arg shard "$shard" '
                  ( .sources | join(",") ) as $sources
                  | ( .tournamentsAdded // 0 ) as $added
                  | ( .totalTournaments // 0 ) as $total
                  | ( [ .perSource[]?.decksKept // 0 ] | add // 0 ) as $decks
                  | ( ( .elapsedMs // 0 ) / 1000 | floor ) as $secs
                  | ( ( .resolutionFailureRate // 0 ) * 100 | floor / 100 ) as $rate
                  | "| \($shard) | \($sources) | \($added) | \($total) | \($decks) | \($secs)s | \($rate)% |"
                ' "$s"
              done
            fi
          } > shard-summary.md
          {
            echo "summary<<EOF"
            cat shard-summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload shard-summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-summary
          path: shard-summary.md
          retention-days: 30

      - name: Merge shards
        run: |
          # nullglob: if no shard artifact landed, the array is empty
          # instead of expanding to the literal glob pattern. We pass
          # shard *directories* (B1) so the merge step picks up the
          # per-tournament files regardless of whether a shard managed
          # to flush a dataset.json snapshot before dying.
          shopt -s nullglob
          shards=(shards/shard-*)
          echo "merging ${#shards[@]} shard(s): ${shards[*]:-<none>}"
          if [ ${#shards[@]} -eq 0 ]; then
            echo "::error::No shard artifact found — nothing to merge."
            exit 1
          fi
          pnpm tournaments:merge-shards \
            --out ./out \
            --dataset-version 1.0.0 \
            "${shards[@]}"

      - name: Validate merged dataset
        run: |
          pnpm tournaments:validate \
            --dataset ./out/dataset.json \
            --cards ./cards/cards.json \
            --report ./out/resolution-report.json

      - name: Detect changes vs prior
        id: changed
        run: |
          # E2: publish when *either* new tournaments OR new decks
          # landed since the prior release. The deck delta matters
          # because B2 + E1 let a tournament gain more decks between
          # runs — without counting them we'd never cut a release
          # for "we finished scraping the rest of that tournament".
          if [ -f ./prior/dataset.json ]; then
            prior_t=$(jq '.tournaments | length' ./prior/dataset.json)
            prior_d=$(jq '[.tournaments[].decks | length] | add // 0' ./prior/dataset.json)
          else
            prior_t=0
            prior_d=0
          fi
          new_t=$(jq '.tournaments | length' ./out/dataset.json)
          new_d=$(jq '[.tournaments[].decks | length] | add // 0' ./out/dataset.json)
          echo "prior_t=$prior_t" >> "$GITHUB_OUTPUT"
          echo "prior_d=$prior_d" >> "$GITHUB_OUTPUT"
          echo "new_t=$new_t"     >> "$GITHUB_OUTPUT"
          echo "new_d=$new_d"     >> "$GITHUB_OUTPUT"
          # Legacy aliases for older release-notes templates.
          echo "prior=$prior_t" >> "$GITHUB_OUTPUT"
          echo "new=$new_t"     >> "$GITHUB_OUTPUT"
          if [ "$new_t" -gt "$prior_t" ] || [ "$new_d" -gt "$prior_d" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi
          echo "tournaments: $prior_t -> $new_t  (+$((new_t - prior_t)))"
          echo "decks:       $prior_d -> $new_d  (+$((new_d - prior_d)))"

      - name: Compute next tournaments-v tag
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        id: tagname
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^tournaments-v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -z "$last" ]; then
            tag="tournaments-v1.0.0"
          else
            v=${last#tournaments-v}
            IFS='.' read -r major minor patch <<<"$v"
            tag="tournaments-v${major}.$((minor + 1)).0"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload merged artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tagname.outputs.tag || format('scrape-{0}', github.run_id) }}
          path: out/
          retention-days: 30

      # C2: save the merged dataset.json as a snapshot the next
      # run's `prepare` will pick up via restore-keys. Saved on
      # every merge, including no-change runs, so progress always
      # carries forward — even when we couldn't publish a release.
      - name: Stage snapshot directory
        run: |
          mkdir -p snapshot
          cp ./out/dataset.json snapshot/dataset.json
      - name: Save in-progress merged snapshot (C2)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: snapshot/
          key: scrape-merged-snapshot-${{ github.run_id }}

      - name: Publish release
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tagname.outputs.tag }}"
          n_tournaments=$(jq '.tournaments | length' ./out/dataset.json)
          n_decks=$(jq '[.tournaments[].decks | length] | add // 0' ./out/dataset.json)
          rate=$(jq -r '(.totalFailureRate * 100) | . * 100 | floor | . / 100 | tostring + "%"' ./out/resolution-report.json)
          card_set_v=$(jq -r .cardSetVersion ./out/dataset.json)
          # Deltas vs prior for the release notes (E2). New decks
          # alone can trigger a release now, so surface both numbers.
          delta_t=$(( ${{ steps.changed.outputs.new_t }} - ${{ steps.changed.outputs.prior_t }} ))
          delta_d=$(( ${{ steps.changed.outputs.new_d }} - ${{ steps.changed.outputs.prior_d }} ))
          {
            echo "## $tag"
            echo
            echo "Tournaments: **$n_tournaments** (+$delta_t)"
            echo "Decks: **$n_decks** (+$delta_d)"
            echo "Resolution failure rate: $rate"
            echo
            echo "Pinned cards snapshot: \`${{ needs.prepare.outputs.cards_tag }}\`"
            echo "\`cardSetVersion\`: \`$card_set_v\`"
            echo
            cat shard-summary.md 2>/dev/null || true
            echo
            echo "See \`resolution-report.json\` (attached) for per-source stats."
          } > release-notes.md
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            ./out/dataset.json \
            ./out/dataset.json.sha256 \
            ./out/resolution-report.json

      - name: Dispatch upstream-tournaments-released to lorcana-training
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          tag="${{ steps.tagname.outputs.tag }}"
          curl -fSs -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bjorvack/lorcana-training/dispatches \
            -d "{\"event_type\":\"upstream-tournaments-released\",\"client_payload\":{\"tag\":\"$tag\"}}"

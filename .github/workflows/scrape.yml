name: scrape

# Scheduled tournaments-vN refresh.
#
# Per-source split (A2):
#   prepare           — resolve pinned cards-vN + latest tournaments-vN
#   scrape-lorcana-gg — single runner, HTTP-only, ~5-10 min
#   scrape-inkdecks   — N-shard matrix, chromium + Turnstile, slow
#   merge             — stitch all shard artifacts into one dataset
#
# A Cloudflare 1015 on one source can't kill the other. lorcana.gg
# never wastes a chromium install. inkdecks shards run independently;
# fail-fast is off so one Turnstile bail doesn't take the rest down.
#
# Per-tournament artifact files (B1) mean a shard that dies still
# contributes every tournament it had already finished — the merge
# step picks up whatever is on disk.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if no new tournaments"
        type: boolean
        default: false
      max_tournaments:
        description: "Per-source cap (e.g. 50 or `inkdecks.com=40,lorcana.gg=200`)"
        type: string
        default: ""

permissions:
  contents: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cards_tag: ${{ steps.cards.outputs.tag }}
      prior_tag: ${{ steps.prior.outputs.tag }}
      have_prior: ${{ steps.prior.outputs.have_prior }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned cards-vN
        id: cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^cards-v' | head -n 1)
          [ -n "$tag" ] || { echo "No cards-vN release found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p cards
          gh release download "$tag" --repo bjorvack/lorcana-scraper -p cards.json -D cards
      - name: Download latest tournaments-vN (prior)
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prior
          tag=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^tournaments-v' | head -n 1 || true)
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo bjorvack/lorcana-scraper -p dataset.json -D prior
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "have_prior=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_prior=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload cards + prior
        uses: actions/upload-artifact@v4
        with:
          name: scrape-inputs
          path: |
            cards/cards.json
            prior/dataset.json
          if-no-files-found: ignore
          retention-days: 1

  scrape-lorcana-gg:
    needs: prepare
    runs-on: ubuntu-latest
    # lorcana.gg is pure HTTP — even a worst-case backfill plus an
    # adaptive Cloudflare 1015 cooldown stays well under an hour.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Restore http cache
        uses: actions/cache@v4
        with:
          path: out/http-cache
          key: http-cache-lorcana-gg-${{ needs.prepare.outputs.prior_tag }}
          restore-keys: |
            http-cache-lorcana-gg-

      - name: Run pipeline (lorcana.gg)
        run: |
          args=()
          max_t="${{ inputs.max_tournaments }}"
          [ -n "$max_t" ] && args+=("--max-tournaments" "$max_t")
          if [ "${{ needs.prepare.outputs.have_prior }}" = "1" ]; then
            args+=("--prior" "./prior/dataset.json")
          fi
          pnpm scrape:tournaments \
            --cards ./cards/cards.json \
            --cards-release-tag "${{ needs.prepare.outputs.cards_tag }}" \
            --sources lorcana.gg \
            --max-decks-per-tournament 16 \
            --persist-every 5 \
            --out ./out "${args[@]}"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-lorcana-gg
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  scrape-inkdecks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Hash-modulo sharding (A1): every shard lists the full
        # archive, then keeps only refs whose key hashes to its
        # bucket. Auto-balances regardless of archive size — bumping
        # the matrix below scales linearly without re-thinking page
        # ranges. Each shard's NEW-tournament cap keeps it well
        # under the job timeout.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TOTAL_SHARDS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install chromium
        run: |
          pnpm exec playwright install chromium --with-deps || \
            npx -y playwright@1.60 install chromium --with-deps

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Restore inkdecks browser state
        # D2: shared across shards. cf_clearance is good for any
        # shard in the same ~30-min window, so the first shard that
        # passes Turnstile saves a cookie all later shards can reuse.
        # actions/cache key includes the workflow run id as the write
        # path so we don't fight each other for writes; restore-keys
        # falls back to the most recent shared state from a prior run.
        uses: actions/cache@v4
        with:
          path: .cache/inkdecks-state.json
          key: inkdecks-state-shared-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            inkdecks-state-shared-

      - name: Restore inkdecks deck-content cache
        # Deck content is content-addressable (per UUID) so sharing
        # across shards just makes re-runs of older tournaments cheap.
        uses: actions/cache@v4
        with:
          path: .cache/inkdecks-decks
          key: inkdecks-decks-shared-${{ github.run_id }}-${{ matrix.shard }}
          restore-keys: |
            inkdecks-decks-shared-

      - name: Run pipeline (inkdecks.com shard ${{ matrix.shard }})
        run: |
          args=()
          # Per-source caps. inkdecks.com is slow (Cloudflare Turnstile +
          # headless chromium); cap so each shard always finishes.
          max_t="${{ inputs.max_tournaments }}"
          [ -z "$max_t" ] && max_t="inkdecks.com=40"
          args+=("--max-tournaments" "$max_t")
          if [ "${{ needs.prepare.outputs.have_prior }}" = "1" ]; then
            args+=("--prior" "./prior/dataset.json")
          fi
          pnpm scrape:tournaments \
            --cards ./cards/cards.json \
            --cards-release-tag "${{ needs.prepare.outputs.cards_tag }}" \
            --sources inkdecks.com \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ env.TOTAL_SHARDS }} \
            --max-decks-per-tournament 16 \
            --persist-every 5 \
            --out ./out "${args[@]}"

      # Always upload — per-tournament files (B1) on disk are the
      # source of truth; the merge job picks up whatever made it.
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-inkdecks-${{ matrix.shard }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  merge:
    # Run even if some shards failed — we still want to publish whatever
    # partial data made it through. `prepare` is non-negotiable though.
    needs: [prepare, scrape-lorcana-gg, scrape-inkdecks]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards/

      - name: Download scrape inputs
        uses: actions/download-artifact@v4
        with:
          name: scrape-inputs

      - name: Merge shards
        run: |
          # nullglob: if no shard artifact landed, the array is empty
          # instead of expanding to the literal glob pattern. We pass
          # shard *directories* (B1) so the merge step picks up the
          # per-tournament files regardless of whether a shard managed
          # to flush a dataset.json snapshot before dying.
          shopt -s nullglob
          shards=(shards/shard-*)
          echo "merging ${#shards[@]} shard(s): ${shards[*]:-<none>}"
          if [ ${#shards[@]} -eq 0 ]; then
            echo "::error::No shard artifact found — nothing to merge."
            exit 1
          fi
          pnpm tournaments:merge-shards \
            --out ./out \
            --dataset-version 1.0.0 \
            "${shards[@]}"

      - name: Validate merged dataset
        run: |
          pnpm tournaments:validate \
            --dataset ./out/dataset.json \
            --cards ./cards/cards.json \
            --report ./out/resolution-report.json

      - name: Detect changes vs prior
        id: changed
        run: |
          if [ -f ./prior/dataset.json ]; then
            prior_n=$(jq '.tournaments | length' ./prior/dataset.json)
          else
            prior_n=0
          fi
          new_n=$(jq '.tournaments | length' ./out/dataset.json)
          echo "prior=$prior_n" >> "$GITHUB_OUTPUT"
          echo "new=$new_n"     >> "$GITHUB_OUTPUT"
          if [ "$new_n" -gt "$prior_n" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next tournaments-v tag
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        id: tagname
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh release list \
            --repo bjorvack/lorcana-scraper \
            --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^tournaments-v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -z "$last" ]; then
            tag="tournaments-v1.0.0"
          else
            v=${last#tournaments-v}
            IFS='.' read -r major minor patch <<<"$v"
            tag="tournaments-v${major}.$((minor + 1)).0"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload merged artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tagname.outputs.tag || format('scrape-{0}', github.run_id) }}
          path: out/
          retention-days: 30

      - name: Publish release
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tagname.outputs.tag }}"
          n_tournaments=$(jq '.tournaments | length' ./out/dataset.json)
          n_decks=$(jq '[.tournaments[].decks | length] | add // 0' ./out/dataset.json)
          rate=$(jq -r '(.totalFailureRate * 100) | . * 100 | floor | . / 100 | tostring + "%"' ./out/resolution-report.json)
          card_set_v=$(jq -r .cardSetVersion ./out/dataset.json)
          {
            echo "## $tag"
            echo
            echo "Tournaments: **$n_tournaments**"
            echo "Decks: **$n_decks**"
            echo "Resolution failure rate: $rate"
            echo
            echo "Pinned cards snapshot: \`${{ needs.prepare.outputs.cards_tag }}\`"
            echo "\`cardSetVersion\`: \`$card_set_v\`"
            echo
            echo "See \`resolution-report.json\` (attached) for per-source stats."
          } > release-notes.md
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            ./out/dataset.json \
            ./out/dataset.json.sha256 \
            ./out/resolution-report.json

      - name: Dispatch upstream-tournaments-released to lorcana-training
        if: steps.changed.outputs.changed == '1' || inputs.force_publish == true
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          tag="${{ steps.tagname.outputs.tag }}"
          curl -fSs -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bjorvack/lorcana-training/dispatches \
            -d "{\"event_type\":\"upstream-tournaments-released\",\"client_payload\":{\"tag\":\"$tag\"}}"

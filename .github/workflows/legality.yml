name: legality

# Weekly poll for banlist + rotation changes. The page contents shift
# only a few times a year, so polling more often is just CI minutes
# burnt against the lorcana.gg cache; once a week is enough to catch
# a new banlist announcement before it propagates downstream.
#
# When either JSON has changed, the workflow opens a PR titled
# `chore(legality): bump banlist/rotation` carrying the diff. Merging
# the PR re-runs `cards.yml` which then attaches the refreshed
# banlist.json / rotation.json to the next `cards-vN` release. No
# tag is cut directly by this workflow.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: read

# Silence the "Node.js 20 actions are deprecated" warning emitted
# for the bundled JavaScript actions (actions/checkout, actions/cache,
# pnpm/action-setup, …). Forces those actions to run on the runner's
# Node 24 ahead of GitHub making it the default in June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@bjorvack"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Headless Chromium for the Playwright escalation path in
      # src/legality/fetch.ts. Cloudflare 403s the undici fetch from
      # GitHub-hosted runner IP ranges; the Playwright fallback fixes
      # that. Cached by version via the pnpm-store / playwright cache
      # contract so subsequent runs are near-free.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download current cards-vN legality assets
        id: prior
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prior
          tag=$(gh release list --limit 50 --json tagName -q '.[].tagName' \
            | grep -E '^cards-v' | head -n 1 || true)
          if [ -n "$tag" ]; then
            gh release download "$tag" -p banlist.json -D prior 2>/dev/null || true
            gh release download "$tag" -p rotation.json -D prior 2>/dev/null || true
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      # lorcana.gg is behind Cloudflare and intermittently 403s the
      # scraper even with browser-like headers (see src/legality/fetch.ts).
      # We mirror the cards.yml pattern: scrape non-fatally, then fall
      # back to the prior cards-vN copies so the workflow can still
      # decide "no diff -> nothing to do" instead of failing red every
      # Monday. A genuine selector-drift bug still surfaces because the
      # downstream "Compute diff vs prior" step will then see a real
      # JSON-shape change.
      - name: Re-scrape from lorcana.gg
        id: scrape
        continue-on-error: true
        run: pnpm scrape:legality --out ./out

      - name: Fall back to prior banlist + rotation if scrape failed
        id: fallback
        run: |
          missing=0
          for f in banlist.json rotation.json; do
            if [ ! -f "./out/$f" ]; then
              if [ -f "./prior/$f" ]; then
                echo "::warning::scrape:legality didn't produce $f; reusing prior copy from ${{ steps.prior.outputs.tag }}"
                mkdir -p ./out
                cp "./prior/$f" "./out/$f"
              else
                echo "::error::scrape:legality didn't produce $f and no prior copy exists"
                missing=1
              fi
            fi
          done
          # Only hard-fail if we have neither fresh data nor a prior to
          # fall back to. That's the real "something is broken" signal.
          if [ "$missing" = "1" ]; then exit 1; fi
          # Surface that we fell back so the run is visibly yellow-ish.
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "scrape_failed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute diff vs prior
        id: diff
        if: steps.fallback.outputs.scrape_failed != '1'
        run: |
          # Normalise generatedAt before comparing — we don't want a
          # PR for a fresh timestamp on otherwise-identical content.
          for f in banlist.json rotation.json; do
            for dir in prior out; do
              if [ -f "$dir/$f" ]; then
                jq 'del(.generatedAt)' "$dir/$f" > "$dir/$f.norm"
              fi
            done
          done
          changed=0
          if [ ! -f prior/banlist.json.norm ] || ! diff -q prior/banlist.json.norm out/banlist.json.norm >/dev/null; then
            changed=1
          fi
          if [ ! -f prior/rotation.json.norm ] || ! diff -q prior/rotation.json.norm out/rotation.json.norm >/dev/null; then
            changed=1
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "## Banlist diff"
            echo '```diff'
            diff -u prior/banlist.json.norm out/banlist.json.norm || true
            echo '```'
            echo
            echo "## Rotation diff"
            echo '```diff'
            diff -u prior/rotation.json.norm out/rotation.json.norm || true
            echo '```'
          } > out/diff.md

      - name: Trigger cards release rebuild
        if: steps.diff.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The simplest "publish a fresh cards-vN with refreshed
          # legality" lever is to re-run cards.yml with force_publish.
          # That re-runs the cards scrape (cheap when cached) plus the
          # legality scrape we already did locally, and produces a
          # fresh tag whose banlist/rotation are current. The diff
          # captured above is attached as the workflow_dispatch note
          # via a follow-up comment.
          gh workflow run cards.yml -f force_publish=true

      - name: Surface diff on the run
        if: steps.diff.outputs.changed == '1'
        run: |
          {
            echo "## Legality changed — triggered cards.yml --force_publish"
            cat out/diff.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when unchanged
        if: steps.diff.outputs.changed == '0'
        run: echo "Banlist and rotation unchanged vs ${{ steps.prior.outputs.tag }} — nothing to publish."

      - name: Surface scrape failure as a warning
        if: steps.fallback.outputs.scrape_failed == '1'
        run: |
          {
            echo "## scrape:legality failed — fell back to ${{ steps.prior.outputs.tag }}"
            echo
            echo "lorcana.gg returned a non-OK response (likely Cloudflare 403)."
            echo "The workflow stayed green because the prior cards-vN release's"
            echo "banlist/rotation are still authoritative until a fresh scrape lands."
            echo "If this keeps happening, escalate the fetch path in"
            echo "\`src/legality/fetch.ts\` (browser headers → Playwright)."
          } >> "$GITHUB_STEP_SUMMARY"
